services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eve_healthcare
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: dev-secret-key-change-me
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://eve:eve@db:5432/eve_healthcare
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
